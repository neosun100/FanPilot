  <path d="M 835,620 L 835,700" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#aOrange)"/>
  <text x="40" y="838" font-size="11.5" font-weight="600" fill="#8ba3c7">图例</text>
  <line x1="90" y1="834" x2="114" y2="834" stroke="#4f9cf9" stroke-width="2.6"/>
  <text x="121" y="838" font-size="10.5" fill="#9db2d0">状态数据：守护写 → App 只读</text>
  <line x1="301.7" y1="834" x2="325.7" y2="834" stroke="#3AAFA9" stroke-width="2.6"/>
  <text x="332.7" y="838" font-size="10.5" fill="#9db2d0">配置流：App 写 → 守护自动重载</text>
  <line x1="523.9" y1="834" x2="547.9" y2="834" stroke="#10b981" stroke-width="2.6"/>
  <text x="554.9" y="838" font-size="10.5" fill="#9db2d0">SMC 硬件读写</text>
  <line x1="649.6999999999999" y1="834" x2="673.6999999999999" y2="834" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="680.6999999999999" y="838" font-size="10.5" fill="#9db2d0">失效安全 → 固件自动控制</text>
