<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 880" font-family="-apple-system,BlinkMacSystemFont,Helvetica Neue,Arial,sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0F4C75"/><stop offset="100%" style="stop-color:#3AAFA9"/>
    </linearGradient>
    <marker id="aBlue" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="10" markerHeight="7" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 z" fill="#4f9cf9"/>
    </marker>
    <marker id="aTeal" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="10" markerHeight="7" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 z" fill="#3AAFA9"/>
    </marker>
    <marker id="aOrange" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="10" markerHeight="7" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 z" fill="#f59e0b"/>
    </marker>
    <marker id="aGreen" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="10" markerHeight="7" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 z" fill="#10b981"/>
    </marker>
  </defs>
  <rect width="960" height="880" fill="#0a1628"/>
  <rect x="40" y="18" width="4" height="30" rx="2" fill="url(#hdr)"/>
  <text x="58" y="34" font-size="20" font-weight="700" fill="#e2e8f0">FanPilot 架构</text>
  <text x="58" y="52" font-size="12" fill="#8ba3c7">macOS 风扇自适应温控 · 控制层与显示层按权限隔离，单向数据流</text>
  <rect x="40" y="76" width="880" height="178" rx="10" fill="#0d1d33" stroke="#1e3a5f" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="58" y="100" font-size="13" font-weight="600" fill="#8ba3c7">① 无特权域 —— 以用户身份运行，绝不直接碰 SMC</text>
  <rect x="70" y="110" width="250" height="116" rx="8" fill="#132b48" stroke="#3AAFA9" stroke-width="1.8"/>
  <text x="195.0" y="134" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">FanPilot.app</text>
  <text x="195.0" y="154" font-size="11" fill="#9db2d0" text-anchor="middle">菜单栏 · Swift / AppKit</text>
  <text x="195.0" y="170" font-size="11" fill="#9db2d0" text-anchor="middle">两行显示 温度 + 转速</text>
  <text x="195.0" y="186" font-size="11" fill="#9db2d0" text-anchor="middle">不申请任何权限</text>
  <rect x="370" y="126" width="200" height="86" rx="8" fill="#132b48" stroke="#3AAFA9" stroke-width="1.8"/>
  <text x="470.0" y="150" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">fanpilot.conf</text>
  <text x="470.0" y="170" font-size="11" fill="#9db2d0" text-anchor="middle">用户可写 · key = value</text>
  <text x="470.0" y="186" font-size="11" fill="#9db2d0" text-anchor="middle">下限 / 曲线 / 限幅</text>
  <rect x="630" y="126" width="250" height="86" rx="8" fill="#132b48" stroke="#4f9cf9" stroke-width="1.8"/>
  <text x="755.0" y="150" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">status.json</text>
  <text x="755.0" y="170" font-size="11" fill="#9db2d0" text-anchor="middle">/var/run · 守护写、App 只读</text>
  <text x="755.0" y="186" font-size="11" fill="#9db2d0" text-anchor="middle">生效配置 + 风扇状态</text>
  <line x1="40" y1="266" x2="920" y2="266" stroke="#f59e0b" stroke-width="2" stroke-dasharray="10,6" opacity="0.75"/>
  <rect x="352" y="256" width="256" height="20" rx="4" fill="#0a1628"/>
  <text x="480" y="270" font-size="11.5" font-weight="600" fill="#f59e0b" text-anchor="middle">权限边界：以上无特权 · 以下 root</text>
  <rect x="40" y="286" width="880" height="352" rx="10" fill="#0d1d33" stroke="#1e3a5f" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="58" y="310" font-size="13" font-weight="600" fill="#8ba3c7">② root 域 —— LaunchDaemon，全机唯一能写 SMC 的进程</text>
  <rect x="60" y="322" width="560" height="298" rx="8" fill="#112742" stroke="#4f9cf9" stroke-width="1.8"/>
  <text x="340" y="348" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">fanpilotd</text>
  <text x="340" y="366" font-size="11" fill="#9db2d0" text-anchor="middle">C · root LaunchDaemon · KeepAlive · flock 单实例锁</text>
  <text x="340" y="396" font-size="11.5" font-weight="600" fill="#3AAFA9" text-anchor="middle">五层控制链（每层解决一个具体抖动来源）</text>
  <rect x="78" y="410" width="96" height="58" rx="6" fill="#0e2murky" opacity="0"/>
  <rect x="78" y="410" width="96" height="58" rx="6" fill="#16324f" stroke="#2c5a8a" stroke-width="1.4"/>
  <text x="126" y="433" font-size="12.5" font-weight="600" fill="#e2e8f0" text-anchor="middle">max()</text>
  <text x="126" y="450" font-size="9.5" fill="#9db2d0" text-anchor="middle">23×Tp*取最大</text>
  <path d="M 174,439 L 186,439" fill="none" stroke="#4f9cf9" stroke-width="1.6" marker-end="url(#aBlue)"/>
  <rect x="188" y="410" width="96" height="58" rx="6" fill="#0e2murky" opacity="0"/>
  <rect x="188" y="410" width="96" height="58" rx="6" fill="#16324f" stroke="#2c5a8a" stroke-width="1.4"/>
  <text x="236" y="433" font-size="12.5" font-weight="600" fill="#e2e8f0" text-anchor="middle">EMA</text>
  <text x="236" y="450" font-size="9.5" fill="#9db2d0" text-anchor="middle">平滑 15s</text>
  <path d="M 284,439 L 296,439" fill="none" stroke="#4f9cf9" stroke-width="1.6" marker-end="url(#aBlue)"/>
  <rect x="298" y="410" width="96" height="58" rx="6" fill="#0e2murky" opacity="0"/>
  <rect x="298" y="410" width="96" height="58" rx="6" fill="#16324f" stroke="#2c5a8a" stroke-width="1.4"/>
  <text x="346" y="433" font-size="12.5" font-weight="600" fill="#e2e8f0" text-anchor="middle">曲线</text>
  <text x="346" y="450" font-size="9.5" fill="#9db2d0" text-anchor="middle">分段线性</text>
  <path d="M 394,439 L 406,439" fill="none" stroke="#4f9cf9" stroke-width="1.6" marker-end="url(#aBlue)"/>
  <rect x="408" y="410" width="96" height="58" rx="6" fill="#0e2murky" opacity="0"/>
  <rect x="408" y="410" width="96" height="58" rx="6" fill="#16324f" stroke="#2c5a8a" stroke-width="1.4"/>
  <text x="456" y="433" font-size="12.5" font-weight="600" fill="#e2e8f0" text-anchor="middle">限幅</text>
  <text x="456" y="450" font-size="9.5" fill="#9db2d0" text-anchor="middle">+200/-60</text>
  <path d="M 504,439 L 516,439" fill="none" stroke="#4f9cf9" stroke-width="1.6" marker-end="url(#aBlue)"/>
  <rect x="518" y="410" width="96" height="58" rx="6" fill="#0e2murky" opacity="0"/>
  <rect x="518" y="410" width="96" height="58" rx="6" fill="#16324f" stroke="#2c5a8a" stroke-width="1.4"/>
  <text x="566" y="433" font-size="12.5" font-weight="600" fill="#e2e8f0" text-anchor="middle">死区</text>
  <text x="566" y="450" font-size="9.5" fill="#9db2d0" text-anchor="middle">50 RPM</text>
  <text x="340" y="500" font-size="10.5" fill="#8ba3c7" text-anchor="middle">配置为不可信输入 ⇒ 安全阈值在代码里硬夹（emergency_temp 夹 70~95°C，紧急路径忽略用户上限）</text>
  <rect x="90" y="516" width="500" height="46" rx="6" fill="#16324f" stroke="#2c5a8a" stroke-width="1.2"/>
  <text x="340" y="534" font-size="11.5" font-weight="600" fill="#3AAFA9" text-anchor="middle">IOKit · AppleSMC 用户客户端（selector 2）</text>
  <text x="340" y="551" font-size="10" fill="#9db2d0" text-anchor="middle">键白名单只有 4 个：F0md / F1md（模式） · F0Tg / F1Tg（目标转速）</text>
  <text x="340" y="588" font-size="10.5" fill="#8ba3c7" text-anchor="middle">曲线按两个风扇各自的硬件上限分别重铺（5349 / 5777 RPM）</text>
  <rect x="650" y="330" width="250" height="92" rx="8" fill="#132b48" stroke="#3AAFA9" stroke-width="1.8"/>
  <text x="775.0" y="354" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">fanlogic.h</text>
  <text x="775.0" y="374" font-size="11" fill="#9db2d0" text-anchor="middle">零 IOKit 依赖 · 可单元测试</text>
  <text x="775.0" y="390" font-size="11" fill="#9db2d0" text-anchor="middle">81 项：边界 / 退化 / 回归</text>
  <rect x="650" y="440" width="250" height="180" rx="8" fill="#2a1f0e" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="775" y="464" font-size="14" font-weight="600" fill="#fbbf24" text-anchor="middle">失效安全（三条路径）</text>
  <text x="666" y="488" font-size="11" font-weight="600" fill="#fbbf24">正常退出 / SIGTERM</text>
  <text x="666" y="503" font-size="10" fill="#c9a86a">→ 写 F*md=0 交还固件</text>
  <text x="666" y="532" font-size="11" font-weight="600" fill="#fbbf24">SIGKILL / 崩溃 / panic</text>
  <text x="666" y="547" font-size="10" fill="#c9a86a">→ launchd 约 1s 重新接管</text>
  <text x="666" y="576" font-size="11" font-weight="600" fill="#fbbf24">传感器读取失败</text>
  <text x="666" y="591" font-size="10" fill="#c9a86a">→ 立即交还固件，不用陈旧值</text>
  <rect x="40" y="670" width="880" height="140" rx="10" fill="#0d1d33" stroke="#1e3a5f" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="58" y="694" font-size="13" font-weight="600" fill="#8ba3c7">③ 硬件</text>
  <rect x="70" y="704" width="280" height="88" rx="8" fill="#132b48" stroke="#10b981" stroke-width="1.8"/>
  <text x="210.0" y="728" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">SMC (System Mgmt Ctrl)</text>
  <text x="210.0" y="748" font-size="11" fill="#9db2d0" text-anchor="middle">3669 个键 · 读免 root、写需 root</text>
  <rect x="400" y="704" width="300" height="88" rx="8" fill="#132b48" stroke="#10b981" stroke-width="1.8"/>
  <text x="550.0" y="728" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">机内风扇 ×2</text>
  <text x="550.0" y="748" font-size="11" fill="#9db2d0" text-anchor="middle">风扇0 1350~5349 RPM</text>
  <text x="550.0" y="764" font-size="11" fill="#9db2d0" text-anchor="middle">风扇1 1350~5777 RPM</text>
  <rect x="750" y="704" width="170" height="88" rx="8" fill="#132b48" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="835.0" y="728" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">固件自动控制</text>
  <text x="835.0" y="748" font-size="11" fill="#9db2d0" text-anchor="middle">F*md = 0</text>
  <text x="835.0" y="764" font-size="11" fill="#9db2d0" text-anchor="middle">出厂行为，永远安全</text>
  <path d="M 420,212 L 420,322" fill="none" stroke="#3AAFA9" stroke-width="1.8" marker-end="url(#aTeal)"/>
  <rect x="365.5" y="279" width="109.0" height="17" rx="3" fill="#0a1628" opacity="0.95"/>
  <text x="420" y="291" font-size="10.5" fill="#3AAFA9" text-anchor="middle">守护监视 mtime 自动重载</text>
  <path d="M 320,168 L 366,168" fill="none" stroke="#3AAFA9" stroke-width="1.8" marker-end="url(#aTeal)"/>
  <rect x="328.1" y="147" width="29.799999999999997" height="17" rx="3" fill="#0a1628" opacity="0.95"/>
  <text x="343" y="159" font-size="10.5" fill="#3AAFA9" text-anchor="middle">写下限</text>
  <path d="M 610,322 L 610,302 L 770,302 L 770,220" fill="none" stroke="#4f9cf9" stroke-width="2" marker-end="url(#aBlue)"/>
  <rect x="628" y="286" width="112" height="17" rx="3" fill="#0a1628" opacity="0.95"/>
  <text x="684" y="298" font-size="10.5" fill="#4f9cf9" text-anchor="middle">写状态（单向）</text>
  <path d="M 755,216 L 755,238 L 200,238 L 200,230" fill="none" stroke="#4f9cf9" stroke-width="1.8" marker-end="url(#aBlue)"/>
  <rect x="430" y="230" width="62" height="17" rx="3" fill="#0a1628" opacity="0.95"/>
  <text x="461" y="242" font-size="10.5" fill="#4f9cf9" text-anchor="middle">只读</text>
  <path d="M 620,376 L 650,376" fill="none" stroke="#3AAFA9" stroke-width="1.6" marker-end="url(#aTeal)"/>
  <path d="M 200,562 L 200,700" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#aGreen)"/>
  <rect x="118" y="648" width="104" height="17" rx="3" fill="#0a1628" opacity="0.95"/>
  <text x="170" y="660" font-size="10.5" fill="#10b981" text-anchor="middle">写 F*Tg / F*md</text>
  <path d="M 290,700 L 290,562" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#aGreen)"/>
  <rect x="286" y="672" width="112" height="17" rx="3" fill="#0a1628" opacity="0.95"/>
  <text x="342" y="684" font-size="10.5" fill="#10b981" text-anchor="middle">读 23×Tp* 温度</text>
